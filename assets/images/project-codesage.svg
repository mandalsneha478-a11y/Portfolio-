<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a16"/>
      <stop offset="50%" stop-color="#0f1730"/>
      <stop offset="100%" stop-color="#091124"/>
    </linearGradient>
    <linearGradient id="geminiBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <filter id="csGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgCs)"/>

  <!-- Code Editor Frame -->
  <rect x="70" y="45" width="460" height="270" rx="14" fill="rgba(12, 16, 35, 0.9)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.5" filter="url(#csGlow)"/>

  <!-- Editor Header Bar -->
  <rect x="70" y="45" width="460" height="36" rx="14" fill="rgba(255, 255, 255, 0.04)"/>
  <circle cx="94" cy="63" r="4.5" fill="#ff5f56"/>
  <circle cx="108" cy="63" r="4.5" fill="#ffbd2e"/>
  <circle cx="122" cy="63" r="4.5" fill="#27c93f"/>

  <!-- Active Tab -->
  <rect x="150" y="52" width="140" height="26" rx="6" fill="rgba(0, 242, 254, 0.15)"/>
  <text x="220" y="69" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">NeuralReviewer.py</text>

  <!-- AI Badge in Header -->
  <rect x="385" y="52" width="130" height="22" rx="11" fill="rgba(157, 78, 221, 0.2)" stroke="rgba(157, 78, 221, 0.5)" stroke-width="1"/>
  <text x="450" y="67" fill="#b026ff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">⚡ CodeSage AI Active</text>

  <!-- Code Window Lines -->
  <!-- Line 1 -->
  <text x="95" y="112" fill="#4a5568" font-family="'JetBrains Mono', monospace" font-size="11">01</text>
  <text x="125" y="112" fill="#ff7b72" font-family="'JetBrains Mono', monospace" font-size="11">async def</text>
  <text x="195" y="112" fill="#d2a8ff" font-family="'JetBrains Mono', monospace" font-size="11">analyze_algorithm</text>
  <text x="325" y="112" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="11">(ast_node):</text>

  <!-- Line 2 -->
  <text x="95" y="136" fill="#4a5568" font-family="'JetBrains Mono', monospace" font-size="11">02</text>
  <text x="145" y="136" fill="#79c0ff" font-family="'JetBrains Mono', monospace" font-size="11">complexity</text>
  <text x="225" y="136" fill="#ff7b72" font-family="'JetBrains Mono', monospace" font-size="11">=</text>
  <text x="245" y="136" fill="#a5d6ff" font-family="'JetBrains Mono', monospace" font-size="11">await</text>
  <text x="290" y="136" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="11">Gemini.inspect</text>
  <text x="390" y="136" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="11">(ast_node)</text>

  <!-- Line 3 -->
  <text x="95" y="160" fill="#4a5568" font-family="'JetBrains Mono', monospace" font-size="11">03</text>
  <text x="145" y="160" fill="#ff7b72" font-family="'JetBrains Mono', monospace" font-size="11">return</text>
  <text x="195" y="160" fill="#79c0ff" font-family="'JetBrains Mono', monospace" font-size="11">complexity.suggestions</text>

  <!-- Inline AI Insight Tooltip / Suggestion Overlay -->
  <g transform="translate(130, 180)">
    <rect x="0" y="0" width="375" height="110" rx="10" fill="rgba(18, 25, 55, 0.95)" stroke="url(#geminiBlue)" stroke-width="1.5" filter="url(#csGlow)"/>
    
    <!-- AI Header inside card -->
    <circle cx="20" cy="22" r="8" fill="url(#geminiBlue)"/>
    <text x="20" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">★</text>
    <text x="36" y="26" fill="#00f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">CodeSage Insight • O(N²) detected</text>
    
    <!-- Score Badge -->
    <rect x="290" y="14" width="70" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="325" y="27" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">Score: 94%</text>

    <!-- Suggestion content -->
    <text x="20" y="52" fill="#cbd5e0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5">Optimize nested loop into a hash-map lookup to achieve</text>
    <text x="20" y="70" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="10.5">O(N) linear runtime complexity.</text>
    
    <!-- Action buttons -->
    <rect x="20" y="82" width="90" height="20" rx="6" fill="#00f2fe"/>
    <text x="65" y="96" fill="#070a16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9.5" text-anchor="middle">Apply Refactor</text>

    <rect x="120" y="82" width="70" height="20" rx="6" fill="rgba(255, 255, 255, 0.08)"/>
    <text x="155" y="96" fill="#a0aec0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" text-anchor="middle">Explain</text>
  </g>
</svg>
