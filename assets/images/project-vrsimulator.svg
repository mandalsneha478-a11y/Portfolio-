<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="vrSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070914"/>
      <stop offset="50%" stop-color="#140f2b"/>
      <stop offset="100%" stop-color="#2a124d"/>
    </linearGradient>
    <linearGradient id="vrNeonGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(176, 38, 255, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 242, 254, 0.1)"/>
    </linearGradient>
    <linearGradient id="hudCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="vrGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="600" height="360" rx="16" fill="url(#vrSky)"/>

  <!-- Synthwave Neon Sun on Horizon -->
  <circle cx="300" cy="160" r="55" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.8" filter="url(#vrGlow)"/>
  <circle cx="300" cy="160" r="50" fill="rgba(255, 0, 127, 0.15)"/>
  <line x1="245" y1="160" x2="355" y2="160" stroke="#070914" stroke-width="3"/>
  <line x1="250" y1="150" x2="350" y2="150" stroke="#070914" stroke-width="2"/>
  <line x1="260" y1="140" x2="340" y2="140" stroke="#070914" stroke-width="2"/>

  <!-- 3D Perspective Road / Grid Lines vanishing into center (300, 160) -->
  <polygon points="300,160 120,360 480,360" fill="rgba(10, 14, 30, 0.95)" stroke="url(#vrNeonGrid)" stroke-width="2"/>
  
  <!-- Road lanes -->
  <line x1="300" y1="160" x2="300" y2="360" stroke="#00f2fe" stroke-width="3" stroke-dasharray="14 10" filter="url(#vrGlow)"/>
  <line x1="300" y1="160" x2="210" y2="360" stroke="#b026ff" stroke-width="1.5" stroke-dasharray="8 8"/>
  <line x1="300" y1="160" x2="390" y2="360" stroke="#b026ff" stroke-width="1.5" stroke-dasharray="8 8"/>

  <!-- VR Headset HUD Grid Frame -->
  <rect x="50" y="40" width="500" height="280" rx="20" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5"/>
  <path d="M 50 80 L 80 80 L 80 50" fill="none" stroke="#00f2fe" stroke-width="3"/>
  <path d="M 550 80 L 520 80 L 520 50" fill="none" stroke="#00f2fe" stroke-width="3"/>
  <path d="M 50 280 L 80 280 L 80 310" fill="none" stroke="#00f2fe" stroke-width="3"/>
  <path d="M 550 280 L 520 280 L 520 310" fill="none" stroke="#00f2fe" stroke-width="3"/>

  <!-- Top HUD Telemetry Display -->
  <rect x="220" y="52" width="160" height="26" rx="13" fill="rgba(0, 0, 0, 0.6)" stroke="#00f2fe" stroke-width="1"/>
  <circle cx="236" cy="65" r="4" fill="#00f2fe">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="300" y="69" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="middle">VR 6DOF: ACTIVE</text>

  <!-- Left HUD Gauge: RPM / SPEED -->
  <g transform="translate(110, 140)">
    <circle cx="0" cy="0" r="40" fill="rgba(6, 10, 25, 0.75)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2"/>
    <path d="M -30 20 A 35 35 0 1 1 30 20" fill="none" stroke="url(#hudCyan)" stroke-width="4" stroke-dasharray="140" stroke-dashoffset="35" filter="url(#vrGlow)"/>
    <text x="0" y="-5" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" text-anchor="middle">128</text>
    <text x="0" y="12" fill="#00f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" text-anchor="middle">KM/H</text>
    <text x="0" y="24" fill="#a0aec0" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">GEAR 4</text>
  </g>

  <!-- Right HUD Gauge: G-FORCE & STABILITY -->
  <g transform="translate(490, 140)">
    <circle cx="0" cy="0" r="40" fill="rgba(6, 10, 25, 0.75)" stroke="rgba(176, 38, 255, 0.4)" stroke-width="2"/>
    <path d="M -25 25 A 35 35 0 1 1 25 25" fill="none" stroke="#b026ff" stroke-width="4" stroke-dasharray="140" stroke-dashoffset="45" filter="url(#vrGlow)"/>
    <text x="0" y="-5" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">1.2 G</text>
    <text x="0" y="12" fill="#b026ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" text-anchor="middle">LATERAL</text>
    <text x="0" y="24" fill="#a0aec0" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">PITCH 0.4°</text>
  </g>

  <!-- Futuristic Steering Wheel in Foreground -->
  <g transform="translate(300, 310)">
    <!-- Steering Outer Arc -->
    <path d="M -90 -20 C -90 -85 90 -85 90 -20 C 90 20 50 40 0 40 C -50 40 -90 20 -90 -20 Z" fill="rgba(12, 16, 34, 0.9)" stroke="#4facfe" stroke-width="3" filter="url(#vrGlow)"/>
    <!-- Center Hub -->
    <circle cx="0" cy="-10" r="28" fill="#151d3b" stroke="#00f2fe" stroke-width="2"/>
    <!-- Unity Logo Symbol -->
    <path d="M 0 -22 L 9 -12 L 0 -2 L -9 -12 Z M -12 -5 L -2 -14 L 3 -6 L -7 3 Z M 12 -5 L 7 3 L -3 -6 L 2 -14 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Left Grip Lights -->
    <circle cx="-65" cy="-30" r="3" fill="#ff007f"/>
    <circle cx="-55" cy="-45" r="3" fill="#00f2fe"/>
    <!-- Right Grip Lights -->
    <circle cx="65" cy="-30" r="3" fill="#ff007f"/>
    <circle cx="55" cy="-45" r="3" fill="#00f2fe"/>
  </g>

  <!-- Unity 3D / C# Pill -->
  <rect x="70" y="280" width="115" height="26" rx="13" fill="rgba(0, 242, 254, 0.15)" stroke="rgba(0, 242, 254, 0.4)"/>
  <text x="127" y="297" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Unity 3D • C#</text>

  <!-- Physics Engine Pill -->
  <rect x="415" y="280" width="115" height="26" rx="13" fill="rgba(176, 38, 255, 0.15)" stroke="rgba(176, 38, 255, 0.4)"/>
  <text x="472" y="297" fill="#b026ff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Realistic Physics</text>
</svg>
