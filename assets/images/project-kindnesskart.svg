<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f"/>
      <stop offset="50%" stop-color="#101838"/>
      <stop offset="100%" stop-color="#0a1026"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="heartPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 42, 82, 0.7)"/>
      <stop offset="100%" stop-color="rgba(14, 20, 45, 0.85)"/>
    </linearGradient>
    <filter id="glowKk" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#bgKk)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(79, 172, 254, 0.08)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Connection Nodes / Network for Donors & NGOs -->
  <g stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6">
    <line x1="150" y1="180" x2="300" y2="110"/>
    <line x1="300" y1="110" x2="450" y2="170"/>
    <line x1="150" y1="180" x2="270" y2="260"/>
    <line x1="270" y1="260" x2="450" y2="170"/>
  </g>

  <!-- Central Donation Hub Card (Glassmorphism) -->
  <rect x="180" y="80" width="240" height="180" rx="14" fill="url(#cardGrad)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" filter="url(#glowKk)"/>
  
  <!-- Header Bar -->
  <rect x="180" y="80" width="240" height="32" rx="14" fill="rgba(255, 255, 255, 0.05)"/>
  <circle cx="196" cy="96" r="4" fill="#ff5f56"/>
  <circle cx="208" cy="96" r="4" fill="#ffbd2e"/>
  <circle cx="220" cy="96" r="4" fill="#27c93f"/>
  <text x="300" y="100" fill="#a0aec0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">kindnesskart.app</text>

  <!-- Heart Icon in Center with Glow -->
  <g transform="translate(300, 160) scale(1.2)">
    <path d="M 0 -8 C -10 -22 -30 -10 -30 10 C -30 25 0 42 0 42 C 0 42 30 25 30 10 C 30 -10 10 -22 0 -8 Z" fill="url(#heartPink)" filter="url(#glowKk)" opacity="0.95"/>
    <path d="M -12 8 L -4 16 L 14 -2" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Impact Metrics Mini-pill -->
  <rect x="220" y="222" width="160" height="24" rx="12" fill="rgba(0, 242, 254, 0.15)" stroke="rgba(0, 242, 254, 0.5)" stroke-width="1"/>
  <text x="300" y="238" fill="#00f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Verified NGOs Connected</text>

  <!-- Left Node: Donor Portal -->
  <g transform="translate(150, 180)">
    <circle cx="0" cy="0" r="34" fill="url(#cardGrad)" stroke="#4facfe" stroke-width="2" filter="url(#glowKk)"/>
    <circle cx="0" cy="-6" r="10" fill="#4facfe" opacity="0.8"/>
    <path d="M -14 16 C -14 6 14 6 14 16 Z" fill="#4facfe" opacity="0.8"/>
    <text x="0" y="44" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Donors</text>
  </g>

  <!-- Right Node: Orphanages / Impact -->
  <g transform="translate(450, 170)">
    <circle cx="0" cy="0" r="34" fill="url(#cardGrad)" stroke="#ff758c" stroke-width="2" filter="url(#glowKk)"/>
    <!-- Building/Home icon -->
    <path d="M 0 -14 L 14 -2 L 10 -2 L 10 12 L -10 12 L -10 -2 L -14 -2 Z" fill="#ff758c"/>
    <text x="0" y="44" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" text-anchor="middle">NGOs &amp; Shelters</text>
  </g>

  <!-- Bottom Node: Realtime Supabase Database -->
  <g transform="translate(270, 260)">
    <circle cx="0" cy="0" r="24" fill="#0b1329" stroke="#3ecf8e" stroke-width="2"/>
    <!-- Lightning / DB Symbol -->
    <path d="M 2 -10 L -6 2 L 0 2 L -2 10 L 6 -2 L 0 -2 Z" fill="#3ecf8e"/>
    <text x="0" y="36" fill="#3ecf8e" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Supabase DB</text>
  </g>

  <!-- Floating Tags -->
  <rect x="40" y="40" width="110" height="26" rx="13" fill="rgba(79, 172, 254, 0.15)" stroke="rgba(79, 172, 254, 0.3)"/>
  <text x="95" y="57" fill="#4facfe" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">React • TS • Tailwind</text>

  <rect x="450" y="40" width="110" height="26" rx="13" fill="rgba(62, 207, 142, 0.15)" stroke="rgba(62, 207, 142, 0.3)"/>
  <text x="505" y="57" fill="#3ecf8e" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Social Impact Platform</text>
</svg>
