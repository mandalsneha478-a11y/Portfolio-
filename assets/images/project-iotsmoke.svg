<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18"/>
      <stop offset="50%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#1a0b12"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="50%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#ffd000"/>
    </linearGradient>
    <linearGradient id="iotCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="iotGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgIot)"/>

  <!-- Circuit Board Traces in Background -->
  <g stroke="rgba(0, 242, 254, 0.12)" stroke-width="1.5" fill="none">
    <path d="M 50 180 L 120 180 L 160 120 L 220 120"/>
    <circle cx="50" cy="180" r="3" fill="#00f2fe"/>
    <circle cx="220" cy="120" r="3" fill="#00f2fe"/>
    
    <path d="M 550 180 L 480 180 L 440 240 L 380 240"/>
    <circle cx="550" cy="180" r="3" fill="#ff7b00"/>
    <circle cx="380" cy="240" r="3" fill="#ff7b00"/>
  </g>

  <!-- Central IoT Gateway / Telemetry Node Card -->
  <rect x="150" y="55" width="300" height="250" rx="16" fill="rgba(18, 23, 45, 0.85)" stroke="rgba(255, 123, 0, 0.35)" stroke-width="1.5" filter="url(#iotGlow)"/>

  <!-- Card Header -->
  <rect x="150" y="55" width="300" height="38" rx="16" fill="rgba(255, 255, 255, 0.04)"/>
  <circle cx="174" cy="74" r="4.5" fill="#ff5f56"/>
  <circle cx="188" cy="74" r="4.5" fill="#ffbd2e"/>
  <circle cx="202" cy="74" r="4.5" fill="#27c93f"/>
  <text x="300" y="78" fill="#ffd000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">NODE-01 // REALTIME SENSOR</text>

  <!-- Central Sensor Core (Smoke & Gas Chamber representation) -->
  <g transform="translate(300, 150)">
    <!-- Expanding sensor signal waves -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="rgba(255, 123, 0, 0.2)" stroke-width="1.5" stroke-dasharray="6 4">
      <animate attributeName="r" values="45;65;45" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#fireGrad)" stroke-width="2" filter="url(#iotGlow)"/>
    <circle cx="0" cy="0" r="32" fill="#120c1e"/>

    <!-- Flame / Gas Icon -->
    <path d="M 0 -18 C 5 -10 12 -6 12 4 C 12 12 6 18 0 18 C -6 18 -12 12 -12 4 C -12 -6 -5 -10 0 -18 Z" fill="url(#fireGrad)" filter="url(#iotGlow)"/>
    <path d="M 0 -6 C 3 -2 6 0 6 6 C 6 10 3 13 0 13 C -3 13 -6 10 -6 6 C -6 0 -3 -2 0 -6 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Live Telemetry Readouts -->
  <!-- Left metric: Gas PPM -->
  <g transform="translate(195, 235)">
    <rect x="-35" y="-18" width="70" height="42" rx="8" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1"/>
    <text x="0" y="-3" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">42 PPM</text>
    <text x="0" y="14" fill="#a0aec0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" text-anchor="middle">SMOKE DENSITY</text>
  </g>

  <!-- Right metric: Temperature -->
  <g transform="translate(405, 235)">
    <rect x="-35" y="-18" width="70" height="42" rx="8" fill="rgba(255, 123, 0, 0.1)" stroke="rgba(255, 123, 0, 0.3)" stroke-width="1"/>
    <text x="0" y="-3" fill="#ff7b00" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">24.6°C</text>
    <text x="0" y="14" fill="#a0aec0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" text-anchor="middle">HEAT SENSOR</text>
  </g>

  <!-- Status Bar at bottom of card -->
  <rect x="180" y="272" width="240" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
  <circle cx="198" cy="283" r="3.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="306" y="287" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">STATUS: SAFE // TRANSMITTING</text>

  <!-- Left Float Badge -->
  <rect x="40" y="275" width="95" height="26" rx="13" fill="rgba(0, 242, 254, 0.15)" stroke="rgba(0, 242, 254, 0.4)"/>
  <text x="87" y="292" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">IoT Telemetry</text>

  <!-- Right Float Badge -->
  <rect x="465" y="275" width="95" height="26" rx="13" fill="rgba(255, 123, 0, 0.15)" stroke="rgba(255, 123, 0, 0.4)"/>
  <text x="512" y="292" fill="#ff7b00" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Realtime Alert</text>
</svg>
