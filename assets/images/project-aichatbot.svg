<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a18"/>
      <stop offset="50%" stop-color="#0f1638"/>
      <stop offset="100%" stop-color="#090d22"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e8cff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glowAi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgAi)"/>

  <!-- Neural Constellation Network (Government Citizen Intelligence) -->
  <g stroke="rgba(157, 78, 221, 0.25)" stroke-width="1.2">
    <line x1="80" y1="80" x2="170" y2="140"/>
    <line x1="170" y1="140" x2="130" y2="240"/>
    <line x1="170" y1="140" x2="270" y2="170"/>
    <line x1="430" y1="140" x2="520" y2="90"/>
    <line x1="430" y1="140" x2="480" y2="250"/>
    <line x1="330" y1="170" x2="430" y2="140"/>
  </g>
  
  <!-- Neural Nodes -->
  <circle cx="80" cy="80" r="4" fill="#4e8cff" opacity="0.6"/>
  <circle cx="130" cy="240" r="4" fill="#9d4edd" opacity="0.6"/>
  <circle cx="520" cy="90" r="4" fill="#00f2fe" opacity="0.6"/>
  <circle cx="480" cy="250" r="4" fill="#ff6b6b" opacity="0.6"/>

  <!-- Chat Mockup Window -->
  <rect x="150" y="50" width="300" height="260" rx="14" fill="rgba(15, 23, 50, 0.85)" stroke="rgba(78, 140, 255, 0.4)" stroke-width="1.5" filter="url(#glowAi)"/>
  
  <!-- Top Bar -->
  <rect x="150" y="50" width="300" height="40" rx="14" fill="rgba(255, 255, 255, 0.04)"/>
  <circle cx="172" cy="70" r="4.5" fill="#ff5f56"/>
  <circle cx="186" cy="70" r="4.5" fill="#ffbd2e"/>
  <circle cx="200" cy="70" r="4.5" fill="#27c93f"/>
  
  <!-- Government Portal Badge -->
  <rect x="235" y="60" width="130" height="20" rx="10" fill="rgba(78, 140, 255, 0.2)" stroke="rgba(78, 140, 255, 0.5)" stroke-width="1"/>
  <text x="300" y="74" fill="#90cdf4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" text-anchor="middle">🏛️ Gov Citizen AI Desk</text>

  <!-- Citizen Message Bubble -->
  <rect x="210" y="105" width="220" height="42" rx="12" fill="rgba(78, 140, 255, 0.25)" stroke="rgba(78, 140, 255, 0.4)" stroke-width="1"/>
  <text x="222" y="122" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">How do I apply for the National</text>
  <text x="222" y="137" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Clean Energy Subsidy scheme?</text>

  <!-- AI Gemini Avatar / Sparkle -->
  <g transform="translate(175, 175)">
    <circle cx="0" cy="0" r="16" fill="url(#geminiGrad)" filter="url(#glowAi)"/>
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#ffffff"/>
  </g>

  <!-- AI Response Message Bubble -->
  <rect x="198" y="165" width="235" height="70" rx="12" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(157, 78, 221, 0.4)" stroke-width="1"/>
  <text x="210" y="184" fill="#00f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10">AI Assistant (Gemini Engine)</text>
  <text x="210" y="200" fill="#cbd5e0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5">Eligibility verified! You need your Aadhaar</text>
  <text x="210" y="215" fill="#cbd5e0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5">&amp; Electricity ID. Step 1: Open Form 4B...</text>

  <!-- Typing / Processing indicator -->
  <g transform="translate(210, 248)">
    <rect x="0" y="0" width="80" height="20" rx="10" fill="rgba(0, 242, 254, 0.15)"/>
    <circle cx="25" cy="10" r="3" fill="#00f2fe">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="10" r="3" fill="#00f2fe">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="10" r="3" fill="#00f2fe">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Input Field Mockup -->
  <rect x="165" y="275" width="270" height="24" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="180" y="291" fill="#718096" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Type your query in English or Hindi...</text>
  <circle cx="422" cy="287" r="7" fill="url(#cyanGrad)"/>
  <path d="M 420 284 L 424 287 L 420 290" stroke="#060914" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Left Pill -->
  <rect x="30" y="280" width="105" height="26" rx="13" fill="rgba(157, 78, 221, 0.15)" stroke="rgba(157, 78, 221, 0.3)"/>
  <text x="82" y="297" fill="#b026ff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">Gemini 1.5 API</text>

  <!-- Right Pill -->
  <rect x="465" y="280" width="105" height="26" rx="13" fill="rgba(0, 242, 254, 0.15)" stroke="rgba(0, 242, 254, 0.3)"/>
  <text x="517" y="297" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">Hackathon Award</text>
</svg>
